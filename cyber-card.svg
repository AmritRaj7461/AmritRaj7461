<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="100%" height="400">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a12" />
      <stop offset="50%" stop-color="#0a1220" />
      <stop offset="100%" stop-color="#050a12" />
    </linearGradient>

    <!-- Neon Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F7FF" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>

    <!-- Purple Glow Gradient -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A2BE2" />
      <stop offset="100%" stop-color="#FF007F" />
    </linearGradient>

    <!-- Radar Sweep Gradient -->
    <radialGradient id="radarSweep" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#00F7FF" stop-opacity="0.4" />
      <stop offset="80%" stop-color="#00F7FF" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#00F7FF" stop-opacity="0" />
    </radialGradient>

    <!-- Glowing Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Cyber Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00F7FF" stroke-width="0.8" stroke-opacity="0.08" />
    </pattern>
  </defs>

  <style>
    /* CSS Keyframes for High-Fidelity HUD Animations */
    
    /* Scrolling Background Grid */
    @keyframes gridScroll {
      0% { transform: translate(0, 0); }
      100% { transform: translate(-40px, -40px); }
    }
    .scrolling-grid {
      animation: gridScroll 8s linear infinite;
    }

    /* Core Rotation CW */
    @keyframes rotateCW {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .rotating-cw {
      animation: rotateCW 12s linear infinite;
    }

    /* Core Rotation CCW */
    @keyframes rotateCCW {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-360deg); }
    }
    .rotating-ccw {
      animation: rotateCCW 8s linear infinite;
    }

    /* Floating Particles */
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-12px) translateX(6px); opacity: 0.9; }
    }
    .particle-1 { animation: floatParticle 5s ease-in-out infinite; }
    .particle-2 { animation: floatParticle 7s ease-in-out infinite 1s; }
    .particle-3 { animation: floatParticle 6s ease-in-out infinite 2.5s; }

    /* Neon Pulsing Effect */
    @keyframes neonPulse {
      0%, 100% { opacity: 0.7; filter: drop-shadow(0 0 2px #00F7FF); }
      50% { opacity: 1; filter: drop-shadow(0 0 12px #00F7FF); }
    }
    .pulsing-glow {
      animation: neonPulse 2.5s ease-in-out infinite;
    }

    /* Typing/Glitch Text Shimmer */
    @keyframes textShimmer {
      0%, 100% { fill: #00F7FF; filter: drop-shadow(0 0 2px #00F7FF); }
      50% { fill: #ffffff; filter: drop-shadow(0 0 15px #00F7FF); }
    }
    .shimmer-text {
      animation: textShimmer 3s ease-in-out infinite;
      font-family: 'Segoe UI', Roboto, sans-serif;
      font-weight: 900;
      letter-spacing: 5px;
    }

    /* Cyber Flow Line */
    @keyframes lineFlow {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }
    .flowing-line {
      stroke-dasharray: 8 12;
      animation: lineFlow 1.5s linear infinite;
    }

    /* Waveform Pulse */
    @keyframes wavePulse {
      0% { stroke-dashoffset: 240; }
      100% { stroke-dashoffset: 0; }
    }
    .waveform-line {
      stroke-dasharray: 120 120;
      animation: wavePulse 3s linear infinite;
    }

    /* Reactor Core Core Pulse */
    @keyframes corePulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 4px #8A2BE2); }
      50% { transform: scale(1.08); filter: drop-shadow(0 0 18px #00F7FF); }
    }
    .pulsing-core {
      animation: corePulse 3s ease-in-out infinite;
    }
  </style>

  <!-- Card Frame -->
  <rect width="880" height="400" rx="18" fill="url(#bgGrad)" stroke="#13243d" stroke-width="2.5" />

  <!-- Animated Scrolling Grid -->
  <g class="scrolling-grid">
    <rect x="-40" y="-40" width="960" height="480" fill="url(#grid)" />
  </g>

  <!-- Outer Neon Border Frame -->
  <rect class="pulsing-glow" x="10" y="10" width="860" height="380" rx="14" fill="none" stroke="url(#cyanGrad)" stroke-width="2" filter="url(#subtleGlow)" />
  <rect x="14" y="14" width="852" height="372" rx="12" fill="none" stroke="#8A2BE2" stroke-width="1" stroke-opacity="0.3" />

  <!-- Floating Star Particles -->
  <circle class="particle-1" cx="80" cy="60" r="3.5" fill="#00F7FF" filter="url(#subtleGlow)" />
  <circle class="particle-2" cx="290" cy="220" r="2.5" fill="#8A2BE2" />
  <circle class="particle-3" cx="440" cy="80" r="3" fill="#00F7FF" />
  <circle class="particle-1" cx="520" cy="260" r="2" fill="#FF007F" />
  <circle class="particle-2" cx="190" cy="310" r="3" fill="#FFFFFF" />

  <!-- Flowing Holographic Connected Wave -->
  <path class="flowing-line" d="M 40,170 Q 250,90 460,170 T 840,170" fill="none" stroke="url(#cyanGrad)" stroke-width="2" stroke-opacity="0.75" filter="url(#subtleGlow)" />

  <!-- LEFT SECTION: Main Identity & Terminal -->
  <g transform="translate(50, 0)">
    <!-- Glassmorphic Terminal Panel -->
    <rect x="0" y="40" width="460" height="200" rx="10" fill="#03070d" fill-opacity="0.88" stroke="#00F7FF" stroke-width="1.5" stroke-opacity="0.5" />
    <path d="M 0,65 L 460,65" stroke="#00F7FF" stroke-width="1.5" stroke-opacity="0.4" />
    <circle cx="18" cy="52" r="5" fill="#FF5F56" />
    <circle cx="34" cy="52" r="5" fill="#FFBD2E" />
    <circle cx="50" cy="52" r="5" fill="#27C93F" />
    <text x="75" y="56" fill="#00F7FF" font-family="monospace" font-size="11" letter-spacing="1" font-weight="bold" fill-opacity="0.6">AMRIT-RAJ@SYSTEM-OS:~</text>

    <!-- Glowing Cyber Name & Subtitle -->
    <text class="shimmer-text" x="30" y="115" font-size="36" filter="url(#neonGlow)">AMRIT RAJ</text>
    <text x="30" y="145" fill="#FFFFFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" letter-spacing="3.5" fill-opacity="0.9">FULL STACK WEB ARCHITECT</text>

    <!-- Terminal Command Output -->
    <g transform="translate(30, 175)" font-family="monospace" font-size="11.5" fill="#FFFFFF" fill-opacity="0.85">
      <text x="0" y="0" fill="#00F7FF">&gt; CO-PILOT: <tspan fill="#FFFFFF" font-weight="bold">DeepMind Antigravity AI 🤖</tspan></text>
      <text x="0" y="18" fill="#00F7FF">&gt; SPECIALTY: <tspan fill="#FFFFFF">Realtime 3D Graphics &amp; Laravel</tspan></text>
      <text x="0" y="36" fill="#00F7FF">&gt; STATE: <tspan fill="#00FF66" font-weight="bold" class="pulsing-glow">FUSION REACTOR ACTIVE 🟢</tspan></text>
    </g>
  </g>

  <!-- RIGHT SECTION: Quantum Fusion Reactor Core -->
  <g transform="translate(730, 140)">
    <!-- Outer Connect Rings -->
    <circle cx="0" cy="0" r="90" fill="none" stroke="#00F7FF" stroke-width="1.5" stroke-opacity="0.15" />
    <circle class="rotating-ccw" cx="0" cy="0" r="78" fill="none" stroke="url(#cyanGrad)" stroke-width="3" stroke-dasharray="15 35 45 25" filter="url(#subtleGlow)" />
    <circle class="rotating-cw" cx="0" cy="0" r="62" fill="none" stroke="url(#purpleGrad)" stroke-width="2" stroke-dasharray="10 12 25 15" />

    <!-- Reactor Core Pulsar -->
    <g class="pulsing-core">
      <circle cx="0" cy="0" r="42" fill="#00F7FF" fill-opacity="0.15" filter="url(#neonGlow)" />
      <circle cx="0" cy="0" r="36" fill="#03070d" stroke="url(#cyanGrad)" stroke-width="2" />
      
      <!-- Internal Quantum Grid Lines -->
      <line x1="0" y1="-30" x2="0" y2="30" stroke="#00F7FF" stroke-width="1.5" />
      <line x1="-30" y1="0" x2="30" y2="0" stroke="#00F7FF" stroke-width="1.5" />
      <circle cx="0" cy="0" r="6" fill="#FFFFFF" filter="url(#neonGlow)" />
      <circle cx="0" cy="-30" r="3" fill="#00F7FF" />
      <circle cx="0" cy="30" r="3" fill="#00F7FF" />
      <circle cx="-30" cy="0" r="3" fill="#00F7FF" />
      <circle cx="30" cy="0" r="3" fill="#00F7FF" />
    </g>
    <text x="0" y="112" font-family="monospace" font-size="10.5" fill="#00F7FF" font-weight="bold" letter-spacing="2.5" text-anchor="middle" class="pulsing-glow">AI FUSION CORE</text>
  </g>

  <!-- LOWER LEFT SECTION: Live Audio Equalizer & Spotify Mockup -->
  <g transform="translate(50, 265)">
    <!-- Equalizer Background Card -->
    <rect x="0" y="0" width="370" height="95" rx="8" fill="#03070d" fill-opacity="0.85" stroke="#00F7FF" stroke-width="1" stroke-opacity="0.3" />
    
    <!-- Music Icon (Glowing) -->
    <g transform="translate(20, 20)">
      <circle cx="20" cy="20" r="18" fill="none" stroke="url(#purpleGrad)" stroke-width="1.5" class="pulsing-glow" />
      <!-- Animated Pulsing Note -->
      <path d="M 16,25 L 16,14 L 26,11 L 26,22 M 16,18 L 26,15" fill="none" stroke="#00F7FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#subtleGlow)">
        <animateTransform attributeName="transform" type="scale" values="1;1.08;1" dur="2s" repeatCount="indefinite" additive="sum" transform-origin="20 20" />
      </path>
    </g>

    <!-- Song Info -->
    <text x="70" y="32" fill="#00F7FF" font-family="monospace" font-size="10.5" font-weight="bold" letter-spacing="1">STREAMING STATUS: ACTIVE 🎧</text>
    <text x="70" y="52" fill="#FFFFFF" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill-opacity="0.95">Lo-Fi Coding Beats &amp; DSA Rhythm</text>
    <text x="70" y="68" fill="#FFFFFF" font-family="'Segoe UI', sans-serif" font-size="10" fill-opacity="0.6">Artist: DeepMind Audio Lab &amp; Antigravity</text>

    <!-- Upward Expanding Animated Equalizer Bars -->
    <!-- Flipping scale y-axis so height extends upwards natively -->
    <g transform="translate(305, 72) scale(1, -1)">
      <rect x="0" y="0" width="3" height="10" rx="0.5" fill="#00F7FF"><animate attributeName="height" values="5;28;12;35;5" dur="1.1s" repeatCount="indefinite" /></rect>
      <rect x="5" y="0" width="3" height="15" rx="0.5" fill="#00F7FF"><animate attributeName="height" values="8;18;35;10;8" dur="0.7s" repeatCount="indefinite" /></rect>
      <rect x="10" y="0" width="3" height="25" rx="0.5" fill="#00F7FF"><animate attributeName="height" values="15;5;25;12;15" dur="1.4s" repeatCount="indefinite" /></rect>
      <rect x="15" y="0" width="3" height="12" rx="0.5" fill="#8A2BE2"><animate attributeName="height" values="10;32;8;22;10" dur="0.9s" repeatCount="indefinite" /></rect>
      <rect x="20" y="0" width="3" height="8" rx="0.5" fill="#8A2BE2"><animate attributeName="height" values="5;15;30;8;5" dur="0.6s" repeatCount="indefinite" /></rect>
      <rect x="25" y="0" width="3" height="20" rx="0.5" fill="#FF007F"><animate attributeName="height" values="12;35;15;26;12" dur="1.2s" repeatCount="indefinite" /></rect>
      <rect x="30" y="0" width="3" height="18" rx="0.5" fill="#FF007F"><animate attributeName="height" values="22;8;28;12;22" dur="0.8s" repeatCount="indefinite" /></rect>
      <rect x="35" y="0" width="3" height="10" rx="0.5" fill="#FFFFFF"><animate attributeName="height" values="8;25;5;35;8" dur="1.3s" repeatCount="indefinite" /></rect>
    </g>
  </g>

  <!-- LOWER RIGHT SECTION: Real-time Cyber Diagnostic Terminal -->
  <g transform="translate(450, 265)">
    <!-- Diagnostic Background Card -->
    <rect x="0" y="0" width="380" height="95" rx="8" fill="#03070d" fill-opacity="0.85" stroke="#00F7FF" stroke-width="1" stroke-opacity="0.3" />

    <!-- Animated Scanning Radar Widget -->
    <g transform="translate(60, 48)">
      <!-- Radar Screen Grid -->
      <circle cx="0" cy="0" r="38" fill="none" stroke="#00F7FF" stroke-width="1" stroke-opacity="0.15" />
      <circle cx="0" cy="0" r="26" fill="none" stroke="#00F7FF" stroke-width="1" stroke-opacity="0.2" />
      <circle cx="0" cy="0" r="14" fill="none" stroke="#00F7FF" stroke-width="1" stroke-opacity="0.2" />
      
      <!-- Sweep Sector rotating 360 degrees -->
      <g>
        <line x1="0" y1="0" x2="0" y2="-38" stroke="#00F7FF" stroke-width="1.8" filter="url(#subtleGlow)" />
        <path d="M 0,0 L 0,-38 A 38,38 0 0,1 32.9,-19 Z" fill="url(#radarSweep)" />
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3s" repeatCount="indefinite" />
      </g>
      <text x="0" y="44" font-family="monospace" font-size="8" fill="#00F7FF" text-anchor="middle" font-weight="bold" letter-spacing="1">RADAR SWEEP</text>
    </g>

    <!-- Animated Refilling Diagnostic Progress Bars -->
    <g transform="translate(130, 16)">
      <!-- DSA Mastery -->
      <g transform="translate(0, 0)">
        <text x="0" y="10" fill="#00F7FF" font-family="monospace" font-size="9.5" font-weight="bold" letter-spacing="1">DSA INTELLECT</text>
        <rect x="110" y="1" width="110" height="9" rx="3.5" fill="#050a12" stroke="#00F7FF" stroke-opacity="0.25" stroke-width="1" />
        <rect x="112" y="3" width="0" height="5" rx="2.5" fill="url(#cyanGrad)">
          <animate attributeName="width" values="0;106;106;0" dur="4s" repeatCount="indefinite" />
        </rect>
      </g>

      <!-- Web Architecture Power -->
      <g transform="translate(0, 24)">
        <text x="0" y="10" fill="#00F7FF" font-family="monospace" font-size="9.5" font-weight="bold" letter-spacing="1">SYS ARCHITECTURE</text>
        <rect x="110" y="1" width="110" height="9" rx="3.5" fill="#050a12" stroke="#00F7FF" stroke-opacity="0.25" stroke-width="1" />
        <rect x="112" y="3" width="0" height="5" rx="2.5" fill="url(#purpleGrad)">
          <animate attributeName="width" values="0;106;106;0" dur="6s" repeatCount="indefinite" />
        </rect>
      </g>

      <!-- Coffee/Focus Level -->
      <g transform="translate(0, 48)">
        <text x="0" y="10" fill="#00F7FF" font-family="monospace" font-size="9.5" font-weight="bold" letter-spacing="1">COGNITIVE RESERVE</text>
        <rect x="110" y="1" width="110" height="9" rx="3.5" fill="#050a12" stroke="#00F7FF" stroke-opacity="0.25" stroke-width="1" />
        <rect x="112" y="3" width="0" height="5" rx="2.5" fill="#FF007F">
          <animate attributeName="width" values="0;106;106;0" dur="5s" repeatCount="indefinite" />
        </rect>
      </g>
    </g>
  </g>
</svg>
