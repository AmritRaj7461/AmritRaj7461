<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="100%" height="320">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d16" />
      <stop offset="100%" stop-color="#0e1726" />
    </linearGradient>

    <!-- Neon Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F7FF" />
      <stop offset="100%" stop-color="#0088FF" />
    </linearGradient>

    <!-- Purple Glow Gradient -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A2BE2" />
      <stop offset="100%" stop-color="#FF007F" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Cyber Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00F7FF" stroke-width="0.7" stroke-opacity="0.07" />
    </pattern>
  </defs>

  <style>
    /* CSS Keyframes for Rich Animations */
    
    /* Grid Scroll Animation */
    @keyframes gridScroll {
      0% { transform: translate(0, 0); }
      100% { transform: translate(-40px, -40px); }
    }
    .scrolling-grid {
      animation: gridScroll 12s linear infinite;
    }

    /* Pulse Glow Animation */
    @keyframes neonPulse {
      0%, 100% { opacity: 0.75; filter: drop-shadow(0 0 2px #00F7FF); }
      50% { opacity: 1; filter: drop-shadow(0 0 10px #00F7FF); }
    }
    .pulsing-glow {
      animation: neonPulse 3s ease-in-out infinite;
    }

    /* Core Rotation */
    @keyframes rotateCW {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes rotateCCW {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-360deg); }
    }
    .rotating-cw {
      transform-origin: 740px 160px;
      animation: rotateCW 20s linear infinite;
    }
    .rotating-ccw {
      transform-origin: 740px 160px;
      animation: rotateCCW 15s linear infinite;
    }

    /* Floating Particles */
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-15px) translateX(8px); opacity: 0.8; }
    }
    .particle-1 { animation: floatParticle 6s ease-in-out infinite; }
    .particle-2 { animation: floatParticle 8s ease-in-out infinite 1s; }
    .particle-3 { animation: floatParticle 5s ease-in-out infinite 2s; }
    .particle-4 { animation: floatParticle 7s ease-in-out infinite 3.5s; }

    /* Text Typing & Shimmer */
    @keyframes textShimmer {
      0%, 100% { fill: #00F7FF; filter: drop-shadow(0 0 2px #00F7FF); }
      50% { fill: #00E5FF; filter: drop-shadow(0 0 12px #00F7FF); }
    }
    .shimmer-text {
      animation: textShimmer 4s ease-in-out infinite;
      font-family: 'Courier New', Courier, monospace;
      font-weight: 900;
      letter-spacing: 4px;
    }

    /* Cyber Lines Animation */
    @keyframes lineFlow {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }
    .flowing-line {
      stroke-dasharray: 8 12;
      animation: lineFlow 2s linear infinite;
    }

    /* Core Pulsing Glow */
    @keyframes corePulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 4px #8A2BE2); }
      50% { transform: scale(1.08); filter: drop-shadow(0 0 16px #00F7FF); }
    }
    .pulsing-core {
      transform-origin: 740px 160px;
      animation: corePulse 4s ease-in-out infinite;
    }
  </style>

  <!-- Card Background -->
  <rect width="880" height="320" rx="16" fill="url(#bgGrad)" stroke="#1a273b" stroke-width="2" />

  <!-- Grid Layer (Scrolling) -->
  <g class="scrolling-grid">
    <rect x="-40" y="-40" width="960" height="400" fill="url(#grid)" />
  </g>

  <!-- Decorative Glowing Borders -->
  <rect x="10" y="10" width="860" height="300" rx="12" fill="none" stroke="#00F7FF" stroke-width="1" stroke-opacity="0.2" />
  <rect class="pulsing-glow" x="8" y="8" width="864" height="304" rx="14" fill="none" stroke="url(#cyanGrad)" stroke-width="1.5" filter="url(#subtleGlow)" />

  <!-- Floating Star Particles -->
  <circle class="particle-1" cx="120" cy="80" r="3" fill="#00F7FF" />
  <circle class="particle-2" cx="240" cy="220" r="2" fill="#8A2BE2" />
  <circle class="particle-3" cx="410" cy="60" r="3.5" fill="#00F7FF" filter="url(#subtleGlow)" />
  <circle class="particle-4" cx="540" cy="240" r="2.5" fill="#FF007F" />
  <circle class="particle-1" cx="320" cy="270" r="1.5" fill="#FFFFFF" />
  <circle class="particle-2" cx="480" cy="140" r="2" fill="#00F7FF" />

  <!-- Holographic Grid Lines / Connectors -->
  <line x1="50" y1="160" x2="680" y2="160" stroke="#00F7FF" stroke-dasharray="2 10" stroke-opacity="0.3" />
  <path class="flowing-line" d="M 60,160 Q 300,100 500,160 T 680,160" fill="none" stroke="url(#cyanGrad)" stroke-width="1.5" stroke-opacity="0.8" />

  <!-- Left Content: Developer Branding -->
  <g transform="translate(60, 0)">
    <!-- Terminal Header Mockup -->
    <rect x="0" y="45" width="460" height="230" rx="8" fill="#050a12" fill-opacity="0.85" stroke="#00F7FF" stroke-width="1" stroke-opacity="0.4" />
    <path d="M 0,65 L 460,65" stroke="#00F7FF" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="15" cy="55" r="4.5" fill="#FF5F56" />
    <circle cx="30" cy="55" r="4.5" fill="#FFBD2E" />
    <circle cx="45" cy="55" r="4.5" fill="#27C93F" />
    <text x="70" y="59" fill="#00F7FF" font-family="monospace" font-size="11" letter-spacing="1" font-weight="bold" fill-opacity="0.6">AMRIT-RAJ@CORE-CORE:~</text>

    <!-- Title and Subtitle -->
    <text class="shimmer-text" x="30" y="115" font-size="34">AMRIT RAJ</text>
    <text x="30" y="145" fill="#FFFFFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" letter-spacing="2" fill-opacity="0.9">FULL STACK WEB ARCHITECT</text>

    <!-- Cyber Status Stats -->
    <g transform="translate(30, 175)" font-family="monospace" font-size="12" fill="#FFFFFF" fill-opacity="0.8">
      <text x="0" y="0" fill="#00F7FF">&gt; OS: <tspan fill="#FFFFFF">LPU-Linux x86_64</tspan></text>
      <text x="0" y="20" fill="#00F7FF">&gt; CO-PILOT: <tspan fill="#FFFFFF">DeepMind-Antigravity-AI</tspan></text>
      <text x="0" y="40" fill="#00F7FF">&gt; INTENT: <tspan fill="#FFFFFF">Creating ultra-premium 3D Web Apps</tspan></text>
      <text x="0" y="60" fill="#00F7FF">&gt; STATUS: <tspan fill="#00FF66" font-weight="bold" class="pulsing-glow">ONLINE &amp; ACTIVE 🚀</tspan></text>
    </g>
  </g>

  <!-- Right Content: The Antigravity AI Fusion Core Reactor -->
  <g>
    <!-- Outer Connecting Cyber-Ring -->
    <circle cx="740" cy="160" r="95" fill="none" stroke="#00F7FF" stroke-width="1" stroke-opacity="0.1" />

    <!-- Rotating Cyber-Dashes (Outer - CCW) -->
    <circle class="rotating-ccw" cx="740" cy="160" r="82" fill="none" stroke="url(#cyanGrad)" stroke-width="3" stroke-dasharray="10 30 40 20" filter="url(#subtleGlow)" />
    
    <!-- Rotating Tech Ring (Inner - CW) -->
    <circle class="rotating-cw" cx="740" cy="160" r="66" fill="none" stroke="url(#purpleGrad)" stroke-width="2" stroke-dasharray="6 8 20 12" />

    <!-- Core Hexagonal / Circular Reactor -->
    <g class="pulsing-core">
      <!-- Glow Underlay -->
      <circle cx="740" cy="160" r="45" fill="#00F7FF" fill-opacity="0.15" filter="url(#neonGlow)" />
      
      <!-- Glassmorphic Core Disk -->
      <circle cx="740" cy="160" r="40" fill="#050a12" stroke="url(#cyanGrad)" stroke-width="2" />
      
      <!-- Quantum Node Network (Inside Core) -->
      <line x1="740" y1="135" x2="740" y2="185" stroke="#00F7FF" stroke-width="1.5" />
      <line x1="715" y1="160" x2="765" y2="160" stroke="#00F7FF" stroke-width="1.5" />
      <line x1="722" y1="142" x2="758" y2="178" stroke="#8A2BE2" stroke-width="1" />
      <line x1="722" y1="178" x2="758" y2="142" stroke="#8A2BE2" stroke-width="1" />
      
      <circle cx="740" cy="160" r="8" fill="#FFFFFF" filter="url(#neonGlow)" />
      <circle cx="740" cy="135" r="4" fill="#00F7FF" />
      <circle cx="740" cy="185" r="4" fill="#00F7FF" />
      <circle cx="715" cy="160" r="4" fill="#00F7FF" />
      <circle cx="765" cy="160" r="4" fill="#00F7FF" />
    </g>

    <!-- AI Text Overlay below Reactor -->
    <text x="740" y="275" font-family="monospace" font-size="11" fill="#00F7FF" fill-opacity="0.8" text-anchor="middle" font-weight="bold" letter-spacing="2" class="pulsing-glow">FUSION CORE</text>
  </g>
</svg>
