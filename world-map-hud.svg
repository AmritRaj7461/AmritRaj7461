<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="100%" height="280">
  <defs>
    <!-- Glowing Filters -->
    <filter id="hudGlowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="hudGlowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Map Grid Dot Pattern -->
    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#00FF66" fill-opacity="0.15" />
    </pattern>
  </defs>

  <style>
    /* Radar Rotation */
    @keyframes spinRadar {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .rotating-dial {
      transform-origin: 180px 140px;
      animation: spinRadar 15s linear infinite;
    }

    /* Connection Line Dash Offset */
    @keyframes pulseDash {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    .active-cable {
      stroke-dasharray: 6 12;
      animation: pulseDash 2s linear infinite;
    }

    /* Node Pulsing */
    @keyframes pulseNode {
      0%, 100% { transform: scale(1); opacity: 0.4; }
      50% { transform: scale(1.4); opacity: 1; filter: drop-shadow(0 0 8px #00FF66); }
    }
    .pulsing-node-1 { animation: pulseNode 3s ease-in-out infinite; transform-origin: 380px 110px; }
    .pulsing-node-2 { animation: pulseNode 4s ease-in-out infinite 1s; transform-origin: 520px 160px; }
    .pulsing-node-3 { animation: pulseNode 2.5s ease-in-out infinite 0.5s; transform-origin: 650px 90px; }
    .pulsing-node-4 { animation: pulseNode 3.5s ease-in-out infinite 1.5s; transform-origin: 450px 200px; }

    /* Matrix Rain / Scanning Bar */
    @keyframes scanHUD {
      0% { transform: translateY(-10px); opacity: 0.1; }
      50% { opacity: 0.6; }
      100% { transform: translateY(290px); opacity: 0.1; }
    }
    .hud-scanner {
      animation: scanHUD 6s linear infinite;
    }

    /* Shimmering Title */
    @keyframes shimmerTitle {
      0%, 100% { fill: #00FF66; filter: drop-shadow(0 0 2px #00FF66); }
      50% { fill: #00F7FF; filter: drop-shadow(0 0 10px #00F7FF); }
    }
    .glowing-title {
      font-family: 'Segoe UI', Roboto, sans-serif;
      font-weight: 900;
      letter-spacing: 6px;
      animation: shimmerTitle 4s ease-in-out infinite;
    }
  </style>

  <!-- Borderless Background Grid -->
  <rect width="880" height="280" fill="none" />
  <rect width="880" height="280" fill="url(#dotGrid)" />

  <!-- Scanning HUD Bar -->
  <rect class="hud-scanner" x="10" width="860" height="2" fill="#00FF66" filter="url(#hudGlowGreen)" />

  <!-- LEFT HUD ELEMENT: Giant Telemetry Dial (Radar) -->
  <g transform="translate(0, 0)">
    <!-- Outer concentric HUD rings -->
    <circle cx="180" cy="140" r="110" fill="none" stroke="#00FF66" stroke-width="1.5" stroke-opacity="0.15" />
    <circle cx="180" cy="140" r="95" fill="none" stroke="#00F7FF" stroke-width="1" stroke-opacity="0.1" stroke-dasharray="3 6" />
    <circle cx="180" cy="140" r="80" fill="none" stroke="#00FF66" stroke-width="2" stroke-opacity="0.2" stroke-dasharray="10 40 20 30" />
    
    <!-- Rotating telemetry dial -->
    <g class="rotating-dial">
      <circle cx="180" cy="140" r="70" fill="none" stroke="#00FF66" stroke-width="2.5" stroke-dasharray="15 15 30 10 5 5" filter="url(#hudGlowGreen)" />
      <line x1="180" y1="70" x2="180" y2="210" stroke="#00F7FF" stroke-width="1" stroke-opacity="0.3" />
      <line x1="110" y1="140" x2="250" y2="140" stroke="#00F7FF" stroke-width="1" stroke-opacity="0.3" />
    </g>

    <!-- Center core core -->
    <circle cx="180" cy="140" r="12" fill="#040810" stroke="#00FF66" stroke-width="2" />
    <circle cx="180" cy="140" r="4" fill="#FFFFFF" filter="url(#hudGlowGreen)" />
    
    <!-- Text Telemetry inside Dial -->
    <text x="180" y="245" font-family="monospace" font-size="10" fill="#00FF66" font-weight="bold" letter-spacing="2.5" text-anchor="middle">COORD UNIT: ACTIVE</text>
  </g>

  <!-- CENTER/RIGHT HUD ELEMENT: Interconnected Global Node Mesh -->
  <g>
    <!-- Curved Grid Latitudes -->
    <path d="M 320,140 Q 520,80 720,140" fill="none" stroke="#00FF66" stroke-width="1" stroke-opacity="0.1" />
    <path d="M 320,140 Q 520,200 720,140" fill="none" stroke="#00FF66" stroke-width="1" stroke-opacity="0.1" />
    <path d="M 520,30 Q 520,140 520,250" fill="none" stroke="#00FF66" stroke-width="1" stroke-opacity="0.1" />

    <!-- Active Holographic Cables (Shooting connection pulses) -->
    <path class="active-cable" d="M 380,110 Q 450,70 520,160" fill="none" stroke="#00F7FF" stroke-width="2" stroke-opacity="0.8" filter="url(#hudGlowCyan)" />
    <path class="active-cable" d="M 520,160 Q 580,120 650,90" fill="none" stroke="#00FF66" stroke-width="1.8" stroke-opacity="0.8" filter="url(#hudGlowGreen)" style="animation-duration: 3s; animation-direction: reverse;" />
    <path class="active-cable" d="M 380,110 L 450,200" fill="none" stroke="#00FF66" stroke-width="1.5" stroke-opacity="0.6" />
    <path class="active-cable" d="M 450,200 L 520,160" fill="none" stroke="#00F7FF" stroke-width="1.5" stroke-opacity="0.6" style="animation-duration: 1.5s;" />

    <!-- Pulsing Nodes (Global Systems) -->
    <g class="pulsing-node-1">
      <circle cx="380" cy="110" r="8" fill="#00FF66" fill-opacity="0.2" />
      <circle cx="380" cy="110" r="4" fill="#00FF66" filter="url(#hudGlowGreen)" />
      <text x="380" y="98" font-family="monospace" font-size="8.5" fill="#00FF66" font-weight="bold" text-anchor="middle">LPU (INDIA)</text>
    </g>

    <g class="pulsing-node-2">
      <circle cx="520" cy="160" r="10" fill="#00F7FF" fill-opacity="0.2" />
      <circle cx="520" cy="160" r="5" fill="#00F7FF" filter="url(#hudGlowCyan)" />
      <text x="520" y="180" font-family="monospace" font-size="8.5" fill="#00F7FF" font-weight="bold" text-anchor="middle">Laravel Core</text>
    </g>

    <g class="pulsing-node-3">
      <circle cx="650" cy="90" r="8" fill="#00FF66" fill-opacity="0.2" />
      <circle cx="650" cy="90" r="4" fill="#00FF66" filter="url(#hudGlowGreen)" />
      <text x="650" y="78" font-family="monospace" font-size="8.5" fill="#00FF66" font-weight="bold" text-anchor="middle">Three.js Core</text>
    </g>

    <g class="pulsing-node-4">
      <circle cx="450" cy="200" r="6" fill="#00FF66" fill-opacity="0.15" />
      <circle cx="450" cy="200" r="3" fill="#00FF66" />
    </g>
  </g>

  <!-- TOP CENTER TEXT: Glitch Brand Logo -->
  <g transform="translate(520, 48)">
    <text class="glowing-title" x="0" y="0" font-size="28" text-anchor="middle">AMRIT RAJ</text>
    <text x="0" y="18" font-family="monospace" font-size="10.5" fill="#ffffff" letter-spacing="4" text-anchor="middle" fill-opacity="0.8">SYSTEM ARCHITECT • FULL STACK ARCHITECT 🌐</text>
  </g>

  <!-- LOWER RIGHT: Dynamic Matrix Terminal Diagnostics -->
  <g transform="translate(680, 185)" font-family="monospace" font-size="10" fill="#00FF66" font-weight="bold">
    <!-- Mini Terminal box -->
    <rect x="-10" y="-12" width="200" height="85" rx="5" fill="#040810" fill-opacity="0.8" stroke="#00FF66" stroke-opacity="0.3" stroke-width="1" />
    <text x="5" y="10" fill="#00F7FF">&gt; OS: LPU-Linux x86_64</text>
    <text x="5" y="24">&gt; INTELLECT: ACTIVE</text>
    <text x="5" y="38">&gt; AI CO-PILOT: ANTIGRAVITY</text>
    <text x="5" y="52" fill="#FFFFFF">&gt; PORTFOLIO METRICS: STABLE</text>
    <text x="5" y="66" fill="#00FF66" class="pulsing-node-1">&gt; SYSTEM STATUS: ONLINE 🟢</text>
  </g>
</svg>
