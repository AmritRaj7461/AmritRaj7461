<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="100%" height="280">
  <defs>
    <!-- Glowing Filters -->
    <filter id="hudGlowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="hudGlowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Map Grid Dot Pattern -->
    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#00FF66" fill-opacity="0.12" />
    </pattern>
  </defs>

  <style>
    /* Radar Rotation */
    @keyframes spinRadar {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .rotating-dial {
      transform-origin: 0px 0px;
      animation: spinRadar 16s linear infinite;
    }

    /* Connection Line Dash Offset */
    @keyframes pulseDash {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    .active-cable {
      stroke-dasharray: 6 12;
      animation: pulseDash 2s linear infinite;
    }

    /* Localized Node Pulsing (No translation conflicts) */
    @keyframes pulseNode {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.35); opacity: 1; }
    }
    .pulse-core-node {
      transform-origin: 0px 0px;
      animation: pulseNode 3s ease-in-out infinite;
    }

    /* Scanning HUD Bar */
    @keyframes scanHUD {
      0% { transform: translateY(-10px); opacity: 0.1; }
      50% { opacity: 0.5; }
      100% { transform: translateY(290px); opacity: 0.1; }
    }
    .hud-scanner {
      animation: scanHUD 7s linear infinite;
    }

    /* Shimmering Title */
    @keyframes shimmerTitle {
      0%, 100% { fill: #00FF66; filter: drop-shadow(0 0 2px #00FF66); }
      50% { fill: #00F7FF; filter: drop-shadow(0 0 8px #00F7FF); }
    }
    .glowing-title {
      font-family: 'Segoe UI', Roboto, sans-serif;
      font-weight: 900;
      letter-spacing: 7px;
      animation: shimmerTitle 4s ease-in-out infinite;
    }
  </style>

  <!-- Borderless Background Grid -->
  <rect width="880" height="280" fill="none" />
  <rect width="880" height="280" fill="url(#dotGrid)" />

  <!-- Scanning HUD Bar -->
  <rect class="hud-scanner" x="10" width="860" height="2" fill="#00FF66" filter="url(#hudGlowGreen)" />

  <!-- TOP CENTER TEXT: Brand Logo -->
  <g transform="translate(440, 42)">
    <text class="glowing-title" x="0" y="0" font-size="28" text-anchor="middle">AMRIT RAJ</text>
    <text x="0" y="18" font-family="monospace" font-size="10.5" fill="#ffffff" letter-spacing="4" text-anchor="middle" fill-opacity="0.8">SYSTEM ARCHITECT • FULL STACK ARCHITECT 🌐</text>
  </g>

  <!-- LEFT HUD ELEMENT: Giant Telemetry Dial (Radar) -->
  <!-- Outer positioning group -->
  <g transform="translate(160, 155)">
    <circle cx="0" cy="0" r="105" fill="none" stroke="#00FF66" stroke-width="1.5" stroke-opacity="0.15" />
    <circle cx="0" cy="0" r="90" fill="none" stroke="#00F7FF" stroke-width="1" stroke-opacity="0.1" stroke-dasharray="3 6" />
    <circle cx="0" cy="0" r="75" fill="none" stroke="#00FF66" stroke-width="2" stroke-opacity="0.2" stroke-dasharray="10 40 20 30" />
    
    <!-- Rotating telemetry dial (nested inner group for animation) -->
    <g class="rotating-dial">
      <circle cx="0" cy="0" r="65" fill="none" stroke="#00FF66" stroke-width="2.5" stroke-dasharray="15 15 30 10 5 5" filter="url(#hudGlowGreen)" />
      <line x1="0" y1="-65" x2="0" y2="65" stroke="#00F7FF" stroke-width="1" stroke-opacity="0.3" />
      <line x1="-65" y1="0" x2="65" y2="0" stroke="#00F7FF" stroke-width="1" stroke-opacity="0.3" />
    </g>

    <!-- Center Core -->
    <circle cx="0" cy="0" r="10" fill="#040810" stroke="#00FF66" stroke-width="2" />
    <circle cx="0" cy="0" r="3" fill="#FFFFFF" filter="url(#hudGlowGreen)" />
    
    <text x="0" y="118" font-family="monospace" font-size="9.5" fill="#00FF66" font-weight="bold" letter-spacing="2.5" text-anchor="middle">COORD UNIT: ACTIVE</text>
  </g>

  <!-- CENTER/RIGHT HUD ELEMENT: Interconnected Global Node Mesh -->
  <g transform="translate(0, 20)">
    <!-- Curved Grid Latitudes -->
    <path d="M 320,130 Q 520,70 720,130" fill="none" stroke="#00FF66" stroke-width="1" stroke-opacity="0.1" />
    <path d="M 320,130 Q 520,190 720,130" fill="none" stroke="#00FF66" stroke-width="1" stroke-opacity="0.1" />
    <path d="M 520,30 Q 520,130 520,230" fill="none" stroke="#00FF66" stroke-width="1" stroke-opacity="0.1" />

    <!-- Active Holographic Cables (Shooting connection pulses) -->
    <path class="active-cable" d="M 380,100 Q 450,60 520,150" fill="none" stroke="#00F7FF" stroke-width="2" stroke-opacity="0.8" filter="url(#hudGlowCyan)" />
    <path class="active-cable" d="M 520,150 Q 580,110 660,80" fill="none" stroke="#00FF66" stroke-width="1.8" stroke-opacity="0.8" filter="url(#hudGlowGreen)" style="animation-duration: 3s; animation-direction: reverse;" />
    <path class="active-cable" d="M 380,100 L 450,190" fill="none" stroke="#00FF66" stroke-width="1.5" stroke-opacity="0.6" />
    <path class="active-cable" d="M 450,190 L 520,150" fill="none" stroke="#00F7FF" stroke-width="1.5" stroke-opacity="0.6" style="animation-duration: 1.5s;" />

    <!-- Node 1 LPU (INDIA) -->
    <!-- Outer positioning group -->
    <g transform="translate(380, 100)">
      <!-- Inner animating group -->
      <g class="pulse-core-node">
        <circle cx="0" cy="0" r="8" fill="#00FF66" fill-opacity="0.2" />
        <circle cx="0" cy="0" r="4" fill="#00FF66" filter="url(#hudGlowGreen)" />
      </g>
      <text x="0" y="-12" font-family="monospace" font-size="8.5" fill="#00FF66" font-weight="bold" text-anchor="middle">LPU (INDIA)</text>
    </g>

    <!-- Node 2 Laravel Core -->
    <g transform="translate(520, 150)">
      <g class="pulse-core-node" style="animation-delay: 1s;">
        <circle cx="0" cy="0" r="10" fill="#00F7FF" fill-opacity="0.2" />
        <circle cx="0" cy="0" r="5" fill="#00F7FF" filter="url(#hudGlowCyan)" />
      </g>
      <text x="0" y="20" font-family="monospace" font-size="8.5" fill="#00FF66" font-weight="bold" text-anchor="middle">Laravel Core</text>
    </g>

    <!-- Node 3 Three.js Core -->
    <g transform="translate(660, 80)">
      <g class="pulse-core-node" style="animation-delay: 0.5s;">
        <circle cx="0" cy="0" r="8" fill="#00FF66" fill-opacity="0.2" />
        <circle cx="0" cy="0" r="4" fill="#00FF66" filter="url(#hudGlowGreen)" />
      </g>
      <text x="0" y="-12" font-family="monospace" font-size="8.5" fill="#00FF66" font-weight="bold" text-anchor="middle">Three.js Core</text>
    </g>

    <!-- Node 4 C++ Core -->
    <g transform="translate(450, 190)">
      <g class="pulse-core-node" style="animation-delay: 1.5s;">
        <circle cx="0" cy="0" r="6" fill="#00FF66" fill-opacity="0.15" />
        <circle cx="0" cy="0" r="3" fill="#00FF66" />
      </g>
    </g>
  </g>

  <!-- LOWER RIGHT: Dynamic Matrix Terminal Diagnostics -->
  <g transform="translate(670, 180)" font-family="monospace" font-size="10" fill="#00FF66" font-weight="bold">
    <!-- Mini Terminal box -->
    <rect x="-10" y="-12" width="200" height="85" rx="5" fill="#040810" fill-opacity="0.85" stroke="#00FF66" stroke-opacity="0.3" stroke-width="1" />
    <text x="5" y="12" fill="#00F7FF">&gt; OS: LPU-Linux x86_64</text>
    <text x="5" y="26">&gt; INTELLECT: ACTIVE</text>
    <text x="5" y="40">&gt; AI CO-PILOT: ANTIGRAVITY</text>
    <text x="5" y="54" fill="#FFFFFF">&gt; PORTFOLIO: STABLE</text>
    <text x="5" y="68" fill="#00FF66">&gt; STATUS: ONLINE 🟢</text>
  </g>
</svg>
