<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 180" width="100%" height="180">
  <defs>
    <!-- Glowing Filters -->
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Glass Gradient -->
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061022" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#020610" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <style>
    /* Circular Loading Sweep Animations */
    @keyframes dialSweep1 {
      0% { stroke-dashoffset: 251; }
      50% { stroke-dashoffset: 60; }
      100% { stroke-dashoffset: 251; }
    }
    @keyframes dialSweep2 {
      0% { stroke-dashoffset: 251; }
      50% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 251; }
    }
    @keyframes dialSweep3 {
      0% { stroke-dashoffset: 251; }
      50% { stroke-dashoffset: 120; }
      100% { stroke-dashoffset: 251; }
    }
    @keyframes dialSweep4 {
      0% { stroke-dashoffset: 251; }
      50% { stroke-dashoffset: 90; }
      100% { stroke-dashoffset: 251; }
    }

    .dial-arc-1 { stroke-dasharray: 251; animation: dialSweep1 5s ease-in-out infinite; }
    .dial-arc-2 { stroke-dasharray: 251; animation: dialSweep2 6s ease-in-out infinite; }
    .dial-arc-3 { stroke-dasharray: 251; animation: dialSweep3 4s ease-in-out infinite; }
    .dial-arc-4 { stroke-dasharray: 251; animation: dialSweep4 7s ease-in-out infinite; }

    /* Heartbeat ECG wave in center */
    @keyframes ecgRun {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    .ecg-line {
      stroke-dasharray: 200 200;
      animation: ecgRun 3.5s linear infinite;
    }
  </style>

  <!-- Panel Base -->
  <rect width="880" height="180" rx="14" fill="url(#glass)" stroke="#112244" stroke-width="1.8" />
  <rect x="2" y="2" width="876" height="176" rx="12" fill="none" stroke="#00FF66" stroke-width="1.5" stroke-opacity="0.25" filter="url(#glowGreen)" />

  <!-- METRIC DIAL 1: TOTAL CONTRIBUTIONS -->
  <g transform="translate(100, 90)">
    <!-- Base track -->
    <circle cx="0" cy="0" r="40" fill="none" stroke="#061224" stroke-width="6" />
    <circle class="dial-arc-1" cx="0" cy="0" r="40" fill="none" stroke="#00FF66" stroke-width="6" stroke-linecap="round" filter="url(#glowGreen)" transform="rotate(-90)" />
    <!-- Text labels -->
    <text x="0" y="5" font-family="monospace" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">160+</text>
    <text x="0" y="58" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#00FF66" text-anchor="middle" letter-spacing="1">CONTRIBUTIONS</text>
  </g>

  <!-- METRIC DIAL 2: DSA SOLVED -->
  <g transform="translate(290, 90)">
    <!-- Base track -->
    <circle cx="0" cy="0" r="40" fill="none" stroke="#061224" stroke-width="6" />
    <circle class="dial-arc-2" cx="0" cy="0" r="40" fill="none" stroke="#00F7FF" stroke-width="6" stroke-linecap="round" filter="url(#glowCyan)" transform="rotate(-90)" />
    <!-- Text labels -->
    <text x="0" y="5" font-family="monospace" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">100+</text>
    <text x="0" y="58" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#00F7FF" text-anchor="middle" letter-spacing="1">DSA SOLVED</text>
  </g>

  <!-- ECG Heartbeat monitor dividing line -->
  <path class="ecg-line" d="M 400,90 L 430,90 L 435,75 L 440,110 L 445,60 L 452,100 L 455,90 L 490,90" fill="none" stroke="#00FF66" stroke-width="2.5" stroke-opacity="0.6" filter="url(#glowGreen)" />

  <!-- METRIC DIAL 3: REPOSITORIES -->
  <g transform="translate(590, 90)">
    <!-- Base track -->
    <circle cx="0" cy="0" r="40" fill="none" stroke="#061224" stroke-width="6" />
    <circle class="dial-arc-3" cx="0" cy="0" r="40" fill="none" stroke="#00FF66" stroke-width="6" stroke-linecap="round" filter="url(#glowGreen)" transform="rotate(-90)" />
    <!-- Text labels -->
    <text x="0" y="5" font-family="monospace" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">25</text>
    <text x="0" y="58" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#00FF66" text-anchor="middle" letter-spacing="1">REPOSITORIES</text>
  </g>

  <!-- METRIC DIAL 4: CURRENT STREAK -->
  <g transform="translate(780, 90)">
    <!-- Base track -->
    <circle cx="0" cy="0" r="40" fill="none" stroke="#061224" stroke-width="6" />
    <circle class="dial-arc-4" cx="0" cy="0" r="40" fill="none" stroke="#00F7FF" stroke-width="6" stroke-linecap="round" filter="url(#glowCyan)" transform="rotate(-90)" />
    <!-- Text labels -->
    <text x="0" y="5" font-family="monospace" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">ACTIVE</text>
    <text x="0" y="58" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#00F7FF" text-anchor="middle" letter-spacing="1">DAILY STREAK</text>
  </g>
</svg>
