<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 130" width="100%" height="130">
  <defs>
    <!-- Glowing Filters -->
    <filter id="neonGlowPink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* ECG Heartbeat line flow */
    @keyframes heartbeatFlow {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    .ecg-line {
      stroke-dasharray: 200 200;
      animation: heartbeatFlow 4s linear infinite;
    }

    @keyframes pulseHeart {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 2px #FF007F); }
      50% { transform: scale(1.15); filter: drop-shadow(0 0 10px #FF007F); }
    }
    .heart-art {
      transform-origin: 760px 65px;
      animation: pulseHeart 1.5s ease-in-out infinite;
    }
  </style>

  <!-- Card Frame -->
  <rect width="880" height="130" rx="12" fill="#040812" stroke="#13243d" stroke-width="2" />
  <rect x="2" y="2" width="876" height="126" rx="10" fill="none" stroke="#FF007F" stroke-width="1.5" stroke-opacity="0.5" filter="url(#neonGlowPink)" />

  <!-- Left Content: Title & Bullet Points -->
  <g transform="translate(30, 0)">
    <text x="0" y="35" fill="#FF007F" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="bold" letter-spacing="1">💉 VacciCare | Vaccine Management &amp; Booking Portal</text>
    <text x="0" y="55" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="12" fill-opacity="0.7">An enterprise-level medical allocation system with interactive glassmorphic UI and logs.</text>
    
    <!-- Micro-systems logs -->
    <g transform="translate(0, 80)" font-family="monospace" font-size="10.5" fill="#FF007F">
      <text x="0" y="0">&gt; STACK: <tspan fill="#ffffff">Laravel (PHP) • MySQL • Bootstrap • Alpine.js</tspan></text>
      <text x="0" y="20">&gt; LOGISTICS: <tspan fill="#00FF66" font-weight="bold">BATCH VERIFICATION CHECKS SUCCESSFUL 🟢</tspan></text>
    </g>
  </g>

  <!-- Loading bar -->
  <g transform="translate(30, 112)">
    <rect width="400" height="5" rx="2.5" fill="#0c192d" />
    <rect x="0" width="0" height="5" rx="2.5" fill="#FF007F" filter="url(#neonGlowPink)">
      <animate attributeName="width" values="0;400;400;0" dur="4.5s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Animated ECG Line running inside the card -->
  <path class="ecg-line" d="M 450,65 L 530,65 L 540,50 L 545,80 L 555,40 L 565,70 L 570,65 L 670,65 L 680,50 L 685,80 L 695,40 L 705,70 L 710,65" fill="none" stroke="#FF007F" stroke-width="2.5" stroke-opacity="0.6" filter="url(#neonGlowPink)" />

  <!-- Right Content: Heart Art -->
  <g class="heart-art" transform="translate(760, 65)">
    <circle cx="0" cy="0" r="35" fill="none" stroke="#FF007F" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="4 8" />
    <!-- Glowing Heart Line Art -->
    <path d="M 0,-12 C -6,-22 -20,-20 -20,-8 C -20,6 -2,16 0,22 C 2,16 20,6 20,-8 C 20,-20 6,-22 0,-12 Z" fill="none" stroke="#FF007F" stroke-width="2.5" filter="url(#neonGlowPink)" />
  </g>
</svg>
