<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 130" width="100%" height="130">
  <defs>
    <!-- Glowing Filters -->
    <filter id="neonGlowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Rotating and Pulsing AI Core */
    @keyframes rotateCore {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulseCore {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 2px #00FF66); }
      50% { transform: scale(1.12); filter: drop-shadow(0 0 10px #00FF66); }
    }
    .core-rings {
      transform-origin: 760px 65px;
      animation: rotateCore 10s linear infinite;
    }
    .core-heart {
      transform-origin: 760px 65px;
      animation: pulseCore 2.5s ease-in-out infinite;
    }
  </style>

  <!-- Card Frame -->
  <rect width="880" height="130" rx="12" fill="#040812" stroke="#13243d" stroke-width="2" />
  <rect x="2" y="2" width="876" height="126" rx="10" fill="none" stroke="#00FF66" stroke-width="1.5" stroke-opacity="0.5" filter="url(#neonGlowGreen)" />

  <!-- Left Content: Title & Bullet Points -->
  <g transform="translate(30, 0)">
    <text x="0" y="35" fill="#00FF66" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="bold" letter-spacing="1">🤖 NEXUS AI | Hybrid Voice Assistant</text>
    <text x="0" y="55" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="12" fill-opacity="0.7">A local voice recognition assistant utilizing Vosk + Google Speech hybrid command pipelines.</text>
    
    <!-- Micro-systems logs -->
    <g transform="translate(0, 80)" font-family="monospace" font-size="10.5" fill="#00FF66">
      <text x="0" y="0">&gt; STACK: <tspan fill="#ffffff">Python • Vosk Engine • Google Speech API • pyttsx3</tspan></text>
      <text x="0" y="20">&gt; AUDIO STREAM: <tspan fill="#00FF66" font-weight="bold">ACTIVE MIC CAPTURE PIPELINE RUNNING 🟢</tspan></text>
    </g>
  </g>

  <!-- Loading bar -->
  <g transform="translate(30, 112)">
    <rect width="400" height="5" rx="2.5" fill="#0c192d" />
    <rect x="0" width="0" height="5" rx="2.5" fill="#00FF66" filter="url(#neonGlowGreen)">
      <animate attributeName="width" values="0;400;400;0" dur="5.5s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Animated Sound Wave Frequency bars (Jumping Upwards) -->
  <!-- Flipping Y axis using translate & scale -->
  <g transform="translate(500, 85) scale(1, -1)">
    <rect x="0" y="0" width="3.5" height="15" rx="1" fill="#00FF66"><animate attributeName="height" values="5;45;12;50;5" dur="1.1s" repeatCount="indefinite" /></rect>
    <rect x="7" y="0" width="3.5" height="25" rx="1" fill="#00FF66"><animate attributeName="height" values="10;25;50;15;10" dur="0.8s" repeatCount="indefinite" /></rect>
    <rect x="14" y="0" width="3.5" height="35" rx="1" fill="#00FF66"><animate attributeName="height" values="20;8;35;18;20" dur="1.4s" repeatCount="indefinite" /></rect>
    <rect x="21" y="0" width="3.5" height="18" rx="1" fill="#FFFFFF"><animate attributeName="height" values="15;42;10;30;15" dur="0.9s" repeatCount="indefinite" /></rect>
    <rect x="28" y="0" width="3.5" height="12" rx="1" fill="#FFFFFF"><animate attributeName="height" values="8;20;45;10;8" dur="0.6s" repeatCount="indefinite" /></rect>
    <rect x="35" y="0" width="3.5" height="28" rx="1" fill="#00FF66"><animate attributeName="height" values="18;50;20;38;18" dur="1.2s" repeatCount="indefinite" /></rect>
    <rect x="42" y="0" width="3.5" height="22" rx="1" fill="#00FF66"><animate attributeName="height" values="30;12;40;18;30" dur="0.7s" repeatCount="indefinite" /></rect>
    <rect x="49" y="0" width="3.5" height="15" rx="1" fill="#00FF66"><animate attributeName="height" values="10;35;8;48;10" dur="1.3s" repeatCount="indefinite" /></rect>
  </g>

  <!-- Right Content: AI Core Rotating Graphic -->
  <g transform="translate(760, 65)">
    <!-- Concentric Dash Rings -->
    <circle class="core-rings" cx="0" cy="0" r="35" fill="none" stroke="#00FF66" stroke-width="1.5" stroke-dasharray="8 8 16 10" />
    <circle class="core-rings" cx="0" cy="0" r="25" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="3 6" style="animation-duration: 6s; animation-direction: reverse;" />
    <!-- Pulse AI Heart Core -->
    <circle class="core-heart" cx="0" cy="0" r="14" fill="#03070d" stroke="#00FF66" stroke-width="2" />
    <circle cx="0" cy="0" r="5" fill="#FFFFFF" filter="url(#neonGlowGreen)" />
  </g>
</svg>
