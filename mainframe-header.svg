<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 50" width="100%" height="50">
  <defs>
    <!-- Glowing Filters -->
    <filter id="neonCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseDot {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; filter: drop-shadow(0 0 4px #00FF66); }
    }
    .pulsing-status-dot {
      animation: pulseDot 2s ease-in-out infinite;
    }
  </style>

  <rect width="880" height="50" fill="none" />

  <g transform="translate(0, 32)">
    <!-- Terminal monitor icon -->
    <text x="5" y="-2" font-family="'Segoe UI Emoji', sans-serif" font-size="20">🖥️</text>
    
    <!-- Stylized Header Text with bracket framing (Refined font sizes and spacing to avoid overlaps) -->
    <text x="40" y="-4" font-family="monospace" font-size="14.5" font-weight="bold" fill="#00F7FF" filter="url(#neonCyan)" letter-spacing="3">
      [ <tspan fill="#ffffff">SYSTEM MAINFRAME</tspan> // AMRIT_RAJ_7461 ]
    </text>

    <!-- Telemetry status indicator shifted to the far right -->
    <circle class="pulsing-status-dot" cx="795" cy="-8" r="4.5" fill="#00FF66" />
    <text x="807" y="-4" font-family="monospace" font-size="10.5" fill="#00FF66" font-weight="bold" letter-spacing="1">ONLINE</text>

    <!-- Sleek baseline divider bridge between text and status -->
    <line x1="475" y1="-8" x2="775" y2="-8" stroke="#112244" stroke-width="1.5" />
    <line x1="475" y1="-8" x2="520" y2="-8" stroke="#00F7FF" stroke-width="2" filter="url(#neonCyan)" />
  </g>
</svg>
