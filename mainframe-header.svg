<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 50" width="100%" height="50">
  <defs>
    <!-- Glowing Filters -->
    <filter id="neonCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseDot {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; filter: drop-shadow(0 0 4px #00FF66); }
    }
    .pulsing-status-dot {
      animation: pulseDot 2s ease-in-out infinite;
    }
  </style>

  <rect width="880" height="50" fill="none" />

  <g transform="translate(0, 32)">
    <!-- Terminal monitor icon -->
    <text x="0" y="0" font-family="'Segoe UI Emoji', sans-serif" font-size="20">🖥️</text>
    
    <!-- Stylized Header Text with bracket framing -->
    <text x="35" y="-2" font-family="monospace" font-size="16" font-weight="bold" fill="#00F7FF" filter="url(#neonCyan)" letter-spacing="3.5">
      [ <tspan fill="#ffffff">SYSTEM MAINFRAME</tspan> // AMRIT_RAJ_7461 ]
    </text>

    <!-- Telemetry indicator dot -->
    <circle class="pulsing-status-dot" cx="440" cy="-7" r="4.5" fill="#00FF66" />
    <text x="452" y="-3" font-family="monospace" font-size="10.5" fill="#00FF66" font-weight="bold" letter-spacing="1">ONLINE</text>

    <!-- Thin baseline divider trail -->
    <line x1="515" y1="-7" x2="880" y2="-7" stroke="#112244" stroke-width="1.5" />
    <line x1="515" y1="-7" x2="560" y2="-7" stroke="#00F7FF" stroke-width="2" filter="url(#neonCyan)" />
  </g>
</svg>
