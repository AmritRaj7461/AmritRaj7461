<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 130" width="100%" height="130">
  <defs>
    <!-- Glowing Filters -->
    <filter id="neonGlowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Sneaker Floating Animation */
    @keyframes floatSneaker {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(-3deg); }
    }
    .sneaker-art {
      transform-origin: 750px 65px;
      animation: floatSneaker 4s ease-in-out infinite;
    }

    /* Core Pulsing Glow */
    @keyframes pulseCard {
      0%, 100% { stroke-opacity: 0.2; }
      50% { stroke-opacity: 0.6; }
    }
    .pulse-border {
      animation: pulseCard 3s ease-in-out infinite;
    }
  </style>

  <!-- Card Frame -->
  <rect width="880" height="130" rx="12" fill="#040812" stroke="#13243d" stroke-width="2" />
  <rect class="pulse-border" x="2" y="2" width="876" height="126" rx="10" fill="none" stroke="#00F7FF" stroke-width="1.5" filter="url(#neonGlowCyan)" />

  <!-- Left Content: Title & Bullet Points -->
  <g transform="translate(30, 0)">
    <text x="0" y="35" fill="#00F7FF" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="bold" letter-spacing="1">👟 VeloStride 3D | Next-Gen 3D E-Commerce</text>
    <text x="0" y="55" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="12" fill-opacity="0.7">An immersive 3D customization and assembly experience showcasing high-performance scrolling.</text>
    
    <!-- Micro-systems logs -->
    <g transform="translate(0, 80)" font-family="monospace" font-size="10.5" fill="#00F7FF">
      <text x="0" y="0">&gt; STACK: <tspan fill="#ffffff">Next.js • React Three Fiber • GSAP • Tailwind CSS</tspan></text>
      <text x="0" y="20">&gt; DEPLOY: <tspan fill="#00FF66" font-weight="bold">100% OPERATIONAL &amp; SECURED 🟢</tspan></text>
    </g>
  </g>

  <!-- Loading bar -->
  <g transform="translate(30, 112)">
    <rect width="400" height="5" rx="2.5" fill="#0c192d" />
    <rect x="0" width="0" height="5" rx="2.5" fill="#00F7FF" filter="url(#neonGlowCyan)">
      <animate attributeName="width" values="0;400;400;0" dur="5s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Right Content: Floating 3D Sneaker Graphic -->
  <g class="sneaker-art" transform="translate(730, 30)">
    <!-- Outer Holographic Rings -->
    <circle cx="30" cy="30" r="45" fill="none" stroke="#00F7FF" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="4 8" />
    
    <!-- Simplified Beautiful Vector Sneaker Path (Glowing Neon Line Art) -->
    <path d="M 0,40 Q 15,30 25,32 L 40,25 L 45,28 L 50,22 L 55,24 L 55,38 L 45,45 L 35,48 L 15,48 L 0,40 Z" fill="none" stroke="#00F7FF" stroke-width="2.5" filter="url(#neonGlowCyan)" />
    <path d="M 15,32 L 35,32 L 45,28" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.6" />
    <circle cx="30" cy="30" r="3" fill="#00FF66" />
  </g>
</svg>
