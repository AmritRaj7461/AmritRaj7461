<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 130" width="100%" height="130">
  <defs>
    <!-- Glowing Filters -->
    <filter id="neonGlowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Radar Laser Scan */
    @keyframes radarScan {
      0% { transform: translateX(-15px); opacity: 0.1; }
      50% { opacity: 0.9; }
      100% { transform: translateX(895px); opacity: 0.1; }
    }
    .laser-scanner {
      animation: radarScan 4s linear infinite;
    }

    @keyframes pulseShield {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 2px #8A2BE2); }
      50% { transform: scale(1.1); filter: drop-shadow(0 0 10px #FF007F); }
    }
    .shield-art {
      transform-origin: 760px 65px;
      animation: pulseShield 3s ease-in-out infinite;
    }
  </style>

  <!-- Card Frame -->
  <rect width="880" height="130" rx="12" fill="#040812" stroke="#13243d" stroke-width="2" />
  <rect x="2" y="2" width="876" height="126" rx="10" fill="none" stroke="#8A2BE2" stroke-width="1.5" stroke-opacity="0.5" filter="url(#neonGlowPurple)" />

  <!-- Running Scanning Laser Line -->
  <line class="laser-scanner" x1="0" y1="4" x2="0" y2="126" stroke="#FF007F" stroke-width="2" filter="url(#neonGlowPurple)" />

  <!-- Left Content: Title & Bullet Points -->
  <g transform="translate(30, 0)">
    <text x="0" y="35" fill="#8A2BE2" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="bold" letter-spacing="1">📝 XampXpress | Secure Online Exam Platform</text>
    <text x="0" y="55" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="12" fill-opacity="0.7">A highly scalable exam environment with automated testing logic and deep Student dashboards.</text>
    
    <!-- Micro-systems logs -->
    <g transform="translate(0, 80)" font-family="monospace" font-size="10.5" fill="#8A2BE2">
      <text x="0" y="0">&gt; STACK: <tspan fill="#ffffff">React.js • Node.js • Express.js • MongoDB • Tailwind CSS</tspan></text>
      <text x="0" y="20">&gt; SECURITY: <tspan fill="#00FF66" font-weight="bold">ACTIVE INTRUSION MONITORING ENABLED 🟢</tspan></text>
    </g>
  </g>

  <!-- Loading bar -->
  <g transform="translate(30, 112)">
    <rect width="400" height="5" rx="2.5" fill="#0c192d" />
    <rect x="0" width="0" height="5" rx="2.5" fill="#8A2BE2" filter="url(#neonGlowPurple)">
      <animate attributeName="width" values="0;400;400;0" dur="6s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Right Content: Security Shield Icon -->
  <g class="shield-art" transform="translate(760, 65)">
    <circle cx="0" cy="0" r="35" fill="none" stroke="#8A2BE2" stroke-width="1" stroke-dasharray="3 6" />
    <!-- Glowing Security Shield Line Art -->
    <path d="M -15,-20 L 15,-20 Q 15,-5 0,20 Q -15,-5 -15,-20 Z" fill="none" stroke="#FF007F" stroke-width="2.5" filter="url(#neonGlowPurple)" />
    <path d="M -8,-12 L 8,-12 Q 8,-3 0,11 Q -8,-3 -8,-12 Z" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.5" />
  </g>
</svg>
